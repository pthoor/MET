name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            www.powershellgallery.com:443
            cdn.powershellgallery.com:443
            psg-prod-eastus.azureedge.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Force -AcceptLicense -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $paths   = @('Public', 'Private', 'Checks', 'MET.psm1', 'MET.psd1')
          $results = $paths | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }

          if ($results) {
            $results | Sort-Object Severity, ScriptName, Line |
              Format-Table -AutoSize -Property Severity, RuleName, ScriptName, Line, Message
            $blockingFindings = @($results | Where-Object Severity -in @('Error', 'Warning'))
            Write-Host "PSScriptAnalyzer: $($results.Count) finding(s) - $($blockingFindings.Count) blocking finding(s)"
            if ($blockingFindings.Count -gt 0) { exit 1 }
          } else {
            Write-Host 'PSScriptAnalyzer: no issues found.'
          }

  test:
    name: Pester (${{ matrix.runner }}, PowerShell ${{ matrix.pwsh_version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            pwsh_version: 7.4.20
            egress_policy: block
            enforce_coverage: false
          - runner: ubuntu-latest
            pwsh_version: 7.6.6
            egress_policy: block
            enforce_coverage: true
          - runner: windows-latest
            pwsh_version: 7.6.6
            egress_policy: audit
            enforce_coverage: false
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ matrix.egress_policy }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            www.powershellgallery.com:443
            cdn.powershellgallery.com:443
            psg-prod-eastus.azureedge.net:443
            packages.microsoft.com:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PowerShell ${{ matrix.pwsh_version }}
        uses: PSModule/install-powershell@159c2929fac34e3c7fc55d75e8997fb27fc7f75a # v1.2.0
        with:
          Version: ${{ matrix.pwsh_version }}

      - name: Verify PowerShell version
        shell: pwsh
        run: |
          $expected = [version]'${{ matrix.pwsh_version }}'
          $actual = $PSVersionTable.PSVersion
          if ($actual -ne $expected) {
            throw "Expected PowerShell $expected but workflow is running $actual."
          }

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -RequiredVersion 5.9.0 -Repository PSGallery -Force -AcceptLicense -Scope CurrentUser

      - name: Exercise Windows Resolve-DnsName branch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function global:Resolve-DnsName {
            param(
              [string] $Name,
              [string] $Type,
              [switch] $DnsOnly,
              [string] $ErrorAction
            )

            return [PSCustomObject]@{
              Name    = $Name
              Type    = $Type
              TTL     = 60
              Strings = @('branch-exercised')
            }
          }

          . ./Private/Resolve-METDnsName.ps1
          $result = Resolve-METDnsName -Name 'contoso.com' -Type TXT
          if ($result.Strings[0] -ne 'branch-exercised') {
            throw 'Resolve-METDnsName did not return the expected Windows-branch result.'
          }

      - name: Run unit tests with coverage
        shell: pwsh
        env:
          MET_ENFORCE_COVERAGE: ${{ matrix.enforce_coverage }}
        run: |
          $config = New-PesterConfiguration
          if ($env:RUNNER_OS -eq 'Windows') {
            $config.Run.Path = @(Get-ChildItem -Path ./Tests/Unit -Filter '*.Tests.ps1' | Where-Object Name -ne 'Resolve-METDnsName.Tests.ps1' | ForEach-Object { $_.FullName })
            Write-Host 'Skipping Resolve-METDnsName.Tests.ps1 on Windows; the file asserts the non-Windows DNS-over-HTTPS fallback path.'
          }
          else {
            $config.Run.Path = './Tests/Unit'
          }
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'TestResults-Unit.xml'
          $config.TestResult.OutputFormat = 'JUnitXml'
          if ($env:MET_ENFORCE_COVERAGE -eq 'true') {
            $config.CodeCoverage.Enabled = $true
            $config.CodeCoverage.Path = @('./Public/*.ps1', './Private/*.ps1', './Checks/**/*.ps1')
            $config.CodeCoverage.OutputPath = 'coverage.xml'
            $config.CodeCoverage.OutputFormat = 'JaCoCo'
          }
          $result = Invoke-Pester -Configuration $config
          if ($result.Result -ne 'Passed') { exit 1 }

      - name: Enforce line coverage threshold (75 %)
        if: ${{ matrix.enforce_coverage }}
        shell: pwsh
        run: |
          [xml]$cov = Get-Content coverage.xml
          $report = $cov.report
          $lineCounter = $report.counter | Where-Object { $_.type -eq 'LINE' } | Select-Object -First 1
          if (-not $lineCounter) {
            throw 'JaCoCo report did not contain a LINE coverage counter.'
          }

          $missed = [int]$lineCounter.missed
          $covered = [int]$lineCounter.covered
          $pct = if (($covered + $missed) -gt 0) { [math]::Round(100 * $covered / ($covered + $missed), 1) } else { 0 }
          Write-Host "Line coverage: $pct %"
          if ($pct -lt 75) {
            Write-Error "Line coverage $pct % is below the 75 % threshold."
            exit 1
          }

      - name: Run integration tests (mocked - no live tenant required)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests/Integration'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'TestResults-Integration.xml'
          $config.TestResult.OutputFormat = 'JUnitXml'
          $result = Invoke-Pester -Configuration $config
          if ($result.Result -ne 'Passed') { exit 1 }

      - name: Publish unit test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        with:
          name: Pester Unit Tests
          path: TestResults-Unit.xml
          reporter: java-junit

      - name: Publish integration test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        with:
          name: Pester Integration Tests
          path: TestResults-Integration.xml
          reporter: java-junit

      - name: Upload Pester artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-results-${{ runner.os }}-pwsh-${{ matrix.pwsh_version }}
          path: |
            TestResults-Unit.xml
            TestResults-Integration.xml
            coverage.xml
          if-no-files-found: warn

  html-report:
    name: HTML report browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443
            packages.microsoft.com:443
            dl.google.com:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: Tests/Html/package-lock.json

      - name: Install HTML test dependencies
        working-directory: ./Tests/Html
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./Tests/Html
        run: npx playwright install --with-deps chromium

      - name: Run HTML report browser tests
        working-directory: ./Tests/Html
        run: npm test

      - name: Upload HTML report test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-report-test-artifacts
          path: |
            Tests/Html/playwright-report
            Tests/Html/test-results
            Tests/Html/.tmp
          if-no-files-found: ignore

  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            trufflehog.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          extra_args: --results=verified,unknown
