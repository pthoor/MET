name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.6.0)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            www.powershellgallery.com:443
            cdn.powershellgallery.com:443
            psg-prod-eastus.azureedge.net:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tagged commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ -z "$tag_commit" ]] || ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit on main."
            exit 1
          fi

      - name: Validate module manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./MET.psd1

      - name: Verify tag matches module version
        shell: pwsh
        run: |
          $manifestVersion = [string](Import-PowerShellDataFile ./MET.psd1).ModuleVersion
          $expectedTag = "v$manifestVersion"

          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Tag '$env:RELEASE_TAG' does not exactly match expected tag '$expectedTag'."
          }

          Write-Host "Version match confirmed: $expectedTag"

      - name: Lint
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -Force -AcceptLicense
          $paths = @('Public', 'Private', 'Checks', 'MET.psm1', 'MET.psd1')
          $results = $paths | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          $blocking = @($results | Where-Object { $_.Severity -in @('Error', 'Warning') })
          if ($blocking.Count -gt 0) {
            $blocking | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            throw "PSScriptAnalyzer found $($blocking.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer: clean'

      - name: Run tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0 -Repository PSGallery -Scope CurrentUser -Force -AcceptLicense

          $unitConfig = New-PesterConfiguration
          $unitConfig.Run.Path = './Tests/Unit'
          $unitConfig.Run.PassThru = $true
          $unitConfig.Output.Verbosity = 'Detailed'
          $unitResult = Invoke-Pester -Configuration $unitConfig
          if ($unitResult.FailedCount -gt 0) {
            throw "Unit tests failed with $($unitResult.FailedCount) failed test(s)."
          }

          $integrationConfig = New-PesterConfiguration
          $integrationConfig.Run.Path = './Tests/Integration'
          $integrationConfig.Run.PassThru = $true
          $integrationConfig.Output.Verbosity = 'Detailed'
          $integrationResult = Invoke-Pester -Configuration $integrationConfig
          if ($integrationResult.FailedCount -gt 0) {
            throw "Integration tests failed with $($integrationResult.FailedCount) failed test(s)."
          }

  publish:
    name: Publish signed-off release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            api.nuget.org:443
            globalcdn.nuget.org:443
            www.powershellgallery.com:443
            cdn.powershellgallery.com:443
            psg-prod-eastus.azureedge.net:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            token.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Stage and package module
        shell: pwsh
        run: |
          $version = (Import-PowerShellDataFile ./MET.psd1).ModuleVersion
          $stage = Join-Path $env:RUNNER_TEMP 'stage' 'MET'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path @('MET.psd1', 'MET.psm1', 'LICENSE') -Destination $stage
          Copy-Item -Path @('Public', 'Private', 'Checks') -Destination $stage -Recurse
          Test-ModuleManifest -Path (Join-Path $stage 'MET.psd1') -ErrorAction Stop
          Compress-Archive -Path "$stage/*" -DestinationPath "met-$version.zip"
          Write-Host "Packaged met-$version.zip"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'met-*.zip'

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            throw 'PSGALLERY_API_KEY secret is not set.'
          }

          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.0.0 -ErrorAction Stop
          $stagingPath = Join-Path $env:RUNNER_TEMP 'stage' 'MET'
          Publish-PSResource -Path $stagingPath -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -Verbose

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release for tag $RELEASE_TAG already exists; skipping creation."
          else
            shopt -s nullglob
            artifacts=(met-*.zip)
            artifact="${artifacts[0]:-}"
            if [[ -z "$artifact" ]]; then
              echo "No packaged artifact matching met-*.zip was found."
              exit 1
            fi

            gh release create "$RELEASE_TAG" \
              --title "MET $RELEASE_TAG" \
              --generate-notes \
              "$artifact"
          fi
